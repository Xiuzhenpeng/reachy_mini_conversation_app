<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reachy Mini Conversation Settings</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Reachy Mini Conversation</p>
        <h1>Self-hosted voice pipeline</h1>
        <p class="muted">
          Configure OpenAI-compatible ASR, chat completions, and TTS endpoints used by the headless conversation loop.
        </p>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <form id="service-form" class="grid-form">
          <label>
            Shared base URL
            <input id="self-openai-base-url" name="self_openai_base_url" placeholder="http://127.0.0.1:8000/v1" />
          </label>
          <label>
            Shared API key
            <input id="self-openai-api-key" name="self_openai_api_key" type="password" placeholder="DUMMY" />
          </label>
          <label>
            ASR base URL
            <input id="self-asr-base-url" name="self_asr_base_url" placeholder="Optional override" />
          </label>
          <label>
            ASR model
            <input id="self-asr-model" name="self_asr_model" placeholder="whisper-1" />
          </label>
          <label>
            LLM base URL
            <input id="self-llm-base-url" name="self_llm_base_url" placeholder="Optional override" />
          </label>
          <label>
            LLM model
            <input id="self-llm-model" name="self_llm_model" placeholder="local-model" />
          </label>
          <label>
            TTS base URL
            <input id="self-tts-base-url" name="self_tts_base_url" placeholder="Optional override" />
          </label>
          <label>
            TTS model
            <input id="self-tts-model" name="self_tts_model" placeholder="tts-1" />
          </label>
          <label>
            TTS voice
            <input id="self-tts-voice" name="self_tts_voice" placeholder="default" />
          </label>
          <label>
            Voice list
            <input id="self-tts-voices" name="self_tts_voices" placeholder="default,Aiden,Serena" />
          </label>
          <label>
            TTS format
            <input id="self-tts-response-format" name="self_tts_response_format" placeholder="wav" />
          </label>
          <button type="submit">Save service config</button>
        </form>
      </section>

      <section id="personality-panel" class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Personality</p>
            <h2>Profiles</h2>
          </div>
          <button id="apply-personality" type="button">Apply</button>
        </div>

        <div class="row">
          <label for="personality-select">Profile</label>
          <select id="personality-select"></select>
        </div>
        <div class="row">
          <label for="voice-select">Voice</label>
          <select id="voice-select"></select>
          <button id="apply-voice" type="button">Apply voice</button>
        </div>
        <div id="personality-status" class="status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="/static/main.js"></script>
  </body>
</html>
